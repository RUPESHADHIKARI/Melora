name: Melora Release

# Publishes a public GitHub Release with an installable APK. Dispatch with a
# tag (e.g. v1.0.0); the build is the stable FOSS release build, signed with
# the shared development key by default.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
      title:
        description: "Release title"
        required: false
        default: "Melora v1.0.0"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & publish Melora release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Restore the stable development key so release APKs keep one signature
      # across local and CI builds; without it the updater rejects the APK on
      # installed devices (SIGNATURE_MISMATCH).
      - name: Restore stable signing key
        env:
          MELORA_KEYSTORE_B64: ${{ secrets.MELORA_KEYSTORE_B64 }}
        run: |
          if [ -n "$MELORA_KEYSTORE_B64" ]; then
            echo "$MELORA_KEYSTORE_B64" | base64 -d > app/persistent-debug.keystore
          else
            echo "::warning::MELORA_KEYSTORE_B64 is not set; this release is signed with a per-run key and the in-app updater will reject it for existing installs."
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # AGP does not auto-generate the debug keystore when the DSL pins
      # storeFile explicitly, so create it up-front on fresh runners.
      - name: Generate debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storetype PKCS12 \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build FOSS release APK
        run: ./gradlew --console=plain :app:assembleFossRelease --warning-mode summary
        env:
          MELORA_APPLICATION_ID: com.melora.app
          MELORA_APP_NAME: Melora
          MELORA_BUILD_COMMIT: ${{ github.sha }}

      - name: Stage release APK
        run: |
          mkdir -p release
          mv app/build/outputs/apk/foss/release/*.apk "release/Melora-${{ inputs.tag }}.apk"

      # The in-app Update Center only offers releases that ship a latest.json
      # manifest; generate it from the built APK so every release is
      # update-ready without manual attachment.
      - name: Generate update manifest
        run: |
          SHA=$(sha256sum "release/Melora-${{ inputs.tag }}.apk" | awk '{ print $1 }')
          CODE=$(jq -r '.elements[0].versionCode' app/build/outputs/apk/foss/release/output-metadata.json)
          NAME=$(jq -r '.elements[0].versionName' app/build/outputs/apk/foss/release/output-metadata.json)
          jq -n \
            --arg name "$NAME" \
            --argjson code "$CODE" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/Melora-${{ inputs.tag }}.apk" \
            --arg sha "$SHA" \
            --arg tag "${{ inputs.tag }}" \
            --arg title "${{ inputs.title }}" \
            '{versionName: $name, versionCode: $code, apkUrl: $url, sha256: $sha, tagName: $tag, releaseTitle: $title}' \
            > release/latest.json
          cat release/latest.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<'EOF'
          ## MELORA — Where Music Comes Alive. 🎵

          A Material 3 YouTube Music client for Android — rebranded, redesigned and built on the [Metrolist](https://github.com/MetrolistGroup/Metrolist) GPL-3.0 foundation.

          - New Melora identity, icon set and animated splash screen
          - YouTube Music streaming, offline playback, lyrics, equalizer, Listen Together, widgets
          - FOSS variant, signed with a debug key for easy installation

          **Install:** download the APK below and allow "Install unknown apps" for your browser/file manager.

          *Designed and Developed by Rupesh*
          EOF

          gh release create "${{ inputs.tag }}" \
            "release/Melora-${{ inputs.tag }}.apk" \
            "release/latest.json" \
            --title "${{ inputs.title }}" \
            --notes-file release-notes.md \
            --latest
