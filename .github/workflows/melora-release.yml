name: Melora Release

# Publishes a public GitHub Release with an installable APK. Dispatch with a
# tag (e.g. v1.0.0); the build is the stable FOSS release build, signed with
# the shared development key by default.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
      title:
        description: "Release title"
        required: false
        default: "Melora v1.0.0"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & publish Melora release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # AGP does not auto-generate the debug keystore when the DSL pins
      # storeFile explicitly, so create it up-front on fresh runners.
      - name: Generate debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storetype PKCS12 \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build FOSS release APK
        run: ./gradlew --console=plain :app:assembleFossRelease --warning-mode summary
        env:
          MELORA_APPLICATION_ID: com.melora.app
          MELORA_APP_NAME: Melora
          MELORA_BUILD_COMMIT: ${{ github.sha }}

      - name: Stage release APK
        run: |
          mkdir -p release
          mv app/build/outputs/apk/foss/release/*.apk "release/Melora-${{ inputs.tag }}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<'EOF'
          ## MELORA — Where Music Comes Alive. 🎵

          A Material 3 YouTube Music client for Android — rebranded, redesigned and built on the [Metrolist](https://github.com/MetrolistGroup/Metrolist) GPL-3.0 foundation.

          - New Melora identity, icon set and animated splash screen
          - YouTube Music streaming, offline playback, lyrics, equalizer, Listen Together, widgets
          - FOSS variant, signed with a debug key for easy installation

          **Install:** download the APK below and allow "Install unknown apps" for your browser/file manager.

          *Designed and Developed by Rupesh*
          EOF

          gh release create "${{ inputs.tag }}" \
            "release/Melora-${{ inputs.tag }}.apk" \
            --title "${{ inputs.title }}" \
            --notes-file release-notes.md \
            --latest
