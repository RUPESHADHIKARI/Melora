name: Melora APK

# Lightweight APK build for repositories without signing secrets: produces an
# installable FOSS debug build (signed with the auto-generated debug key).
# The full signed nightly/release pipeline stays in build.yml / release.yml.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "fastlane/**"
      - "assets/**"
      - "**.md"
      - ".github/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_apk:
    name: Build Melora APK (FOSS debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build FOSS debug APK
        run: ./gradlew --console=plain :app:assembleFossDebug --warning-mode summary
        env:
          MELORA_APPLICATION_ID: com.melora.app
          MELORA_APP_NAME: Melora
          MELORA_BUILD_COMMIT: ${{ github.sha }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: melora-foss-debug
          path: app/build/outputs/apk/foss/debug/*.apk
